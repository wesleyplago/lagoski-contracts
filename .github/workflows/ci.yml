name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: a validação compara com a versão anterior
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Schemas compilam, exemplos validam, sem quebra de compatibilidade
        run: pnpm validate
      - name: AsyncAPI 3.0
        run: for f in asyncapi/*.yaml; do npx --yes @asyncapi/cli@6.2.3 validate "$f"; done
